# ==========================================================================
# Основной конфиг nginx ВНУТРИ одноразового контейнера.
# Не путать с deploy/nginx.conf — это конфигурация внешнего reverse-proxy.
# Этот файл полностью заменяет /etc/nginx/nginx.conf.
# ==========================================================================

user  nginx;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи — в stdout, чтобы их видно в docker logs
    access_log  /dev/stdout;
    error_log   /dev/stderr  warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Проксирование запросов к node внутри контейнера
    client_body_temp_path /var/lib/nginx/tmp/client_temp;
    proxy_temp_path       /var/lib/nginx/tmp/proxy_temp;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi_temp;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi_temp;
    scgi_temp_path        /var/lib/nginx/tmp/scgi_temp;

    # --- Сжатие ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    server {
        # Порт фиксирован: переменные окружения в конфиг nginx не подставляются.
        # Снаружи контейнера Traefik проксирует трафик на 80.
        listen       80;
        server_name  _;
        root         /var/www/html;
        index        index.html;

        # Форму не нужно принимать тела больше 64 КБ
        client_max_body_size 64k;

        # --- Заголовки безопасности ---
        # HSTS без includeSubDomains: поддомены (push./habit./coolify.)
        # обслуживаются тем же Traefik, но задавать им политику отсюда нельзя.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

        # --- Проверка живости (healthcheck) ---
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # --- Форма обратной связи ---
        location /api/ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Form-Token      $http_x_form_token;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # --- Статика ---
        # add_header ниже перекрывает унаследованные из server{}, поэтому
        # защитные заголовки дублируются в каждом location с own add_header.
        location /images/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options  "nosniff" always;
        }

        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options  "nosniff" always;
        }

        location ~* \.(webmanifest|svg|ico|png|jpg|jpeg|webp|avif|woff2?)$ {
            expires 30d;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # --- Страницы ---
        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # HTML не кэшируем, чтобы правки были видны сразу
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options  "nosniff" always;
        }
    }
}
