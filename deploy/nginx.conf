# ==========================================================================
# nginx для riool-hw.ru: раздача статики фронтенда + проксирование формы
#
# Файл монтируется в контейнер как /etc/nginx/conf.d/default.conf
# (см. docker-compose.yml). Фрагменты из snippets/*.inc подключаются через
# include: директивы add_header не наследуются в location, а сами location
# нельзя вынести в отдельный файл conf.d — nginx включил бы его на уровне http.
# ==========================================================================

upstream riool_backend {
    server backend:3000;
}

# --------------------------------------------------------------------------
# Редирект HTTP -> HTTPS
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name riool-hw.ru www.riool-hw.ru;

    # Проверка домена для выпуска сертификата.
    # Должна идти до запретов и редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/deny-internal.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# Основной сайт
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name riool-hw.ru www.riool-hw.ru;

    # --- SSL (Let's Encrypt). Пути внутри контейнера certbot ---
    ssl_certificate     /etc/letsencrypt/live/riool-hw.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riool-hw.ru/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Базовые заголовки безопасности ---
    include /etc/nginx/snippets/security-headers.inc;

    # --- Сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Форму не нужно принимать тела больше 64 КБ
    client_max_body_size 64k;

    # --- Не отдаём наружу внутренние файлы проекта ---
    include /etc/nginx/snippets/deny-internal.inc;

    # --- Форма обратной связи: /api/* уходит на Node.js ---
    location /api/ {
        proxy_pass         http://riool_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Form-Token      $http_x_form_token;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        include /etc/nginx/snippets/security-headers.inc;
    }

    # Проверка живости бэкенда (для внешнего мониторинга)
    location = /health {
        access_log off;
        proxy_pass       http://riool_backend/health;
        proxy_set_header Host $host;
    }

    # --- Статика: картинки (долгий кэш, имена меняются при обновлении) ---
    location /images/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.inc;
    }

    # --- CSS и JS ---
    location ~* \.(css|js)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.inc;
    }

    # --- Прочие статические файлы ---
    location ~* \.(webmanifest|svg|ico|png|jpg|jpeg|webp|avif|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # --- Страницы ---
    location = / {
        # Корень сайта: отдаём главную. Явный блок нужен потому, что
        # try_files ниже превращает "/" в "//" и "/.html" и не находит файл.
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # HTML не кэшируем, чтобы правки были видны сразу
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.inc;
    }
}
