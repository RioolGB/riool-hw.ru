  <text x="474" y="546" font-family="Inter, system-ui, Arial, sans-serif" font-size="17" fill="#f2f7f5">Спасибо, Алексей! Ты в списке ✅</text>
  <text x="474" y="568" font-family="Inter, system-ui, Arial, sans-serif" font-size="13" fill="#7e9a91">21:06</text>

