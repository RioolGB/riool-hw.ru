  <text x="474" y="252" font-family="Inter, system-ui, Arial, sans-serif" font-size="17" fill="#f2f7f5">Business IT Day 👋</text>

  <rect x="1050" y="290" width="310" height="58" rx="16" fill="url(#ac)" />
  <text x="1070" y="316" font-family="Inter, system-ui, Arial, sans-serif" font-size="17" font-weight="600" fill="#04231a">Хочу зарегистрироваться</text>
  <text x="1070" y="338" font-family="Inter, system-ui, Arial, sans-serif" font-size="13" fill="#0a3d2e">21:05</text>

  <rect x="452" y="376" width="476" height="116" rx="16" fill="rgba(255,255,255,0.08)" />
  <text x="474" y="404" font-family="Inter, system-ui, Arial, sans-serif" font-size="17" fill="#f2f7f5">Отлично! Напиши мне: ФИО, email,</text>
  <text x="474" y="430" font-family="Inter, system-ui, Arial, sans-serif" font-size="17" fill="#f2f7f5">телефон и компанию — соберу</text>
  <text x="474" y="456" font-family="Inter, system-ui, Arial, sans-serif" font-size="17" fill="#f2f7f5">и запишу тебя на конференцию.</text>
  <text x="474" y="482" font-family="Inter, system-ui, Arial, sans-serif" font-size="13" fill="#7e9a91">21:05</text>

