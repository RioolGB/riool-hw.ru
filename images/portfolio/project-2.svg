    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
  </defs>

  <rect width="1897" height="928" fill="url(#bg)" />

  <!-- Окно чата -->
  <rect x="410" y="52" width="1077" height="824" rx="26" fill="#0e4635" stroke="rgba(125,240,196,0.18)" />
  <rect x="410" y="52" width="1077" height="92" rx="26" fill="rgba(0,0,0,0.18)" />

