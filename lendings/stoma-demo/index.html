<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cloud-api.yandex.net https://disk.yandex.ru;">
  <title>Стоматологический калькулятор — демо</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main App -->
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Калькулятор лечения</h1>
        <p class="app-subtitle" id="data-status">Загрузка данных...</p>
      </div>
      <div class="header-right">
        <button class="btn btn-accent" id="update-prices-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 2v6h-6"/>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M3 22v-6h6"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
          Обновить цены
        </button>
        <button class="btn btn-secondary" id="load-data-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Загрузить файл
        </button>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none">
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Left Panel - Services -->
      <div class="panel services-panel">
        <div class="panel-header">
          <h2 class="panel-title">Услуги</h2>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="search-input" placeholder="Поиск услуг..." class="search-input">
          </div>
        </div>

        <!-- Category Filters -->
        <div class="filters" id="filters-container">
          <button class="filter-btn active" data-category="all">Все</button>
        </div>

        <!-- Services List -->
        <div class="services-list" id="services-list">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <p>Загрузите файл прайс-листа</p>
            <p class="empty-hint">Поддерживаются форматы .xlsx, .xls, .csv</p>
          </div>
        </div>
      </div>

      <!-- Right Panel - Treatment Plan -->
      <div class="panel plan-panel">
        <div class="panel-header">
          <h2 class="panel-title">План лечения</h2>
          <button class="btn btn-small btn-secondary" id="clear-plan-btn">
            <svg class="btn-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Очистить
          </button>
        </div>

        <!-- Patient Info -->
        <div class="patient-info">
          <input type="text" id="patient-name" placeholder="Имя пациента" class="input-field">
          <textarea id="patient-notes" placeholder="Пожелания и заметки пациента..." class="textarea-field"></textarea>
        </div>

        <!-- Selected Services -->
        <div class="selected-services" id="selected-services">
          <div class="empty-plan">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <p>Выберите услуги из списка</p>
          </div>
        </div>

        <!-- Total -->
        <div class="total-section">
          <div class="total-row">
            <span class="total-label">Итого:</span>
            <span class="total-value" id="total-value">0 ₽</span>
          </div>
          <div class="total-row total-savings" id="savings-row" style="display: none;">
            <span class="total-label">Скидка:</span>
            <span class="total-value savings" id="savings-value">0 ₽</span>
          </div>
          <div class="total-row total-final">
            <span class="total-label">К оплате:</span>
            <span class="total-value final" id="final-value">0 ₽</span>
          </div>
        </div>

        <!-- Actions -->
        <div class="plan-actions">
          <button class="btn btn-secondary" id="export-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Сохранить
          </button>
          <button class="btn btn-primary" id="print-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            Печать
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span class="toast-message" id="toast-message"></span>
  </div>

  <script src="protect.js"></script>
  <script src="app.js"></script>
</body>
</html>
